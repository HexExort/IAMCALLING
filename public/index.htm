<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Звонки и чат</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }
  .centered {
    align-items: center;
    justify-content: center;
  }
  h2 { text-align: center; }
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 90%;
    max-width: 340px;
    margin: 0 auto;
  }
  input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    font-size: 16px;
    width: 100%;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  .link-btn {
    background: none;
    color: #60a5fa;
    text-decoration: underline;
    padding: 4px;
  }
  .error { color: #f87171; text-align: center; min-height: 20px; font-size: 14px; }

  /* Chat screen */
  #chat-header {
    padding: 12px 16px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #333;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 15px;
  }
  .msg.mine {
    align-self: flex-end;
    background: #3b82f6;
  }
  .msg.theirs {
    align-self: flex-start;
    background: #2a2a2a;
  }
  #message-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #333;
    width: 100%;
    max-width: none;
    margin: 0;
  }
  #message-input { flex: 1; }
  #call-btn { width: auto; background: #16a34a; }
  #call-btn:hover { background: #15803d; }

  /* Call screen */
  #call-screen-inner { position: relative; width: 100%; height: 100%; }
  #remote-video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #local-video {
    position: absolute; bottom: 20px; right: 20px;
    width: 130px; border-radius: 10px; border: 2px solid #fff; background: #000;
  }
  #call-status {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px; font-size: 14px;
  }
  #hangup {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #dc2626; padding: 12px 24px;
  }
  #hangup:hover { background: #b91c1c; }
  .top-nav { display: flex; gap: 8px; align-items: center; }
  .top-nav button { padding: 6px 12px; font-size: 14px; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen active centered">
  <form id="auth-form">
    <h2 id="auth-title">Вход</h2>
    <input id="username-input" type="text" placeholder="Никнейм" autocomplete="username" required>
    <input id="password-input" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit" id="auth-submit">Войти</button>
    <button type="button" class="link-btn" id="toggle-auth">Нет аккаунта? Зарегистрироваться</button>
    <div class="error" id="auth-error"></div>
  </form>
</div>

<!-- CONTACT SCREEN -->
<div id="contact-screen" class="screen centered">
  <form id="contact-form">
    <h2>Кому пишем?</h2>
    <p style="text-align:center; color:#999; font-size:14px;">Введите никнейм собеседника (он должен быть зарегистрирован)</p>
    <input id="contact-input" type="text" placeholder="Никнейм собеседника" required>
    <button type="submit">Открыть чат</button>
    <button type="button" class="link-btn" id="logout-btn">Выйти из аккаунта</button>
  </form>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen" class="screen">
  <div id="chat-header">
    <div class="top-nav">
      <button id="back-btn">← Назад</button>
      <span id="chat-with"></span>
    </div>
    <button id="call-btn">📹 Позвонить</button>
  </div>
  <div id="messages"></div>
  <form id="message-form">
    <input id="message-input" type="text" placeholder="Сообщение..." autocomplete="off">
    <button type="submit">Отправить</button>
  </form>
</div>

<!-- CALL SCREEN -->
<div id="call-screen" class="screen">
  <div id="call-screen-inner">
    <div id="call-status">Вызов...</div>
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <button id="hangup">Завершить звонок</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ---------- Helpers ----------
function show(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// ---------- State ----------
let me = null;
let currentContact = null;
let socket = null;
let localStream = null;
let peerConnection = null;
let inCall = false;

const config = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};

// ---------- Auth ----------
let isRegisterMode = false;
const authForm = document.getElementById('auth-form');
const authTitle = document.getElementById('auth-title');
const authSubmit = document.getElementById('auth-submit');
const authError = document.getElementById('auth-error');

document.getElementById('toggle-auth').onclick = () => {
  isRegisterMode = !isRegisterMode;
  authTitle.textContent = isRegisterMode ? 'Регистрация' : 'Вход';
  authSubmit.textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
  document.getElementById('toggle-auth').textContent = isRegisterMode
    ? 'Уже есть аккаунт? Войти'
    : 'Нет аккаунта? Зарегистрироваться';
  authError.textContent = '';
};

authForm.onsubmit = async (e) => {
  e.preventDefault();
  authError.textContent = '';
  const username = document.getElementById('username-input').value.trim();
  const password = document.getElementById('password-input').value;
  const endpoint = isRegisterMode ? '/api/register' : '/api/login';
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      authError.textContent = data.error || 'Ошибка';
      return;
    }
    me = data.username;
    afterLogin();
  } catch (err) {
    authError.textContent = 'Не удалось связаться с сервером';
  }
};

async function afterLogin() {
  connectSocket();
  await setupPush();
  show('contact-screen');
}

document.getElementById('logout-btn').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
};

// Check if already logged in (session cookie)
(async () => {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (data.username) {
    me = data.username;
    afterLogin();
  }
})();

// ---------- Push notifications ----------
async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const keyRes = await fetch('/api/vapid-public-key');
    const { key } = await keyRes.json();
    if (!key) return;

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(key)
      });
    }
    await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub)
    });
  } catch (err) {
    console.warn('Push setup failed', err);
  }
}

// ---------- Socket ----------
function connectSocket() {
  socket = io();

  socket.on('chat-message', ({ sender, body }) => {
    if (sender === currentContact || sender === me) {
      addMessageToUI(sender, body);
    }
  });

  socket.on('incoming-call', ({ from }) => {
    if (confirm(`Входящий звонок от ${from}. Ответить?`)) {
      currentContact = from;
      document.getElementById('chat-with').textContent = from;
      startCall(false);
    }
  });

  socket.on('signal', async ({ from, data }) => {
    if (!peerConnection) return;
    if (data.type === 'offer') {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('signal', { contact: from, data: peerConnection.localDescription });
    } else if (data.type === 'answer') {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
    } else if (data.candidate) {
      try { await peerConnection.addIceCandidate(new RTCIceCandidate(data)); } catch (e) {}
    }
  });

  socket.on('call-ended', () => {
    endCall(false);
  });
}

// ---------- Contact / Chat ----------
document.getElementById('contact-form').onsubmit = async (e) => {
  e.preventDefault();
  const contact = document.getElementById('contact-input').value.trim();
  if (!contact || contact === me) return;
  currentContact = contact;
  document.getElementById('chat-with').textContent = contact;
  document.getElementById('messages').innerHTML = '';

  socket.emit('join-chat', contact);

  const res = await fetch(`/api/messages/${encodeURIComponent(contact)}`);
  const history = await res.json();
  history.forEach(m => addMessageToUI(m.sender, m.body));

  show('chat-screen');
};

document.getElementById('back-btn').onclick = () => {
  currentContact = null;
  show('contact-screen');
};

function addMessageToUI(sender, body) {
  const div = document.createElement('div');
  div.className = 'msg ' + (sender === me ? 'mine' : 'theirs');
  div.textContent = body;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

document.getElementById('message-form').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('message-input');
  const body = input.value.trim();
  if (!body || !currentContact) return;
  socket.emit('chat-message', { contact: currentContact, body });
  input.value = '';
};

// ---------- Video call ----------
document.getElementById('call-btn').onclick = () => {
  if (!currentContact) return;
  socket.emit('call-user', { contact: currentContact });
  startCall(true);
};

async function startCall(isCaller) {
  if (inCall) return;
  inCall = true;
  show('call-screen');
  document.getElementById('call-status').textContent = isCaller ? 'Звоним...' : 'Соединяем...';

  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById('local-video').srcObject = localStream;

  peerConnection = new RTCPeerConnection(config);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = (event) => {
    document.getElementById('remote-video').srcObject = event.streams[0];
    document.getElementById('call-status').style.display = 'none';
  };

  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('signal', { contact: currentContact, data: event.candidate });
    }
  };

  if (isCaller) {
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('signal', { contact: currentContact, data: peerConnection.localDescription });
  }
}

document.getElementById('hangup').onclick = () => endCall(true);

function endCall(notifyServer) {
  inCall = false;
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById('remote-video').srcObject = null;
  document.getElementById('call-status').style.display = 'block';
  document.getElementById('call-status').textContent = 'Вызов...';
  if (notifyServer && currentContact) {
    socket.emit('call-ended', { contact: currentContact });
  }
  show('chat-screen');
}
</script>

</body>
</html>
