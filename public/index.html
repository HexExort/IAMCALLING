<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I AM CALLING">
<meta name="theme-color" content="#111111">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I AM CALLING</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #05050a;
    color: #eee;
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #space-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(ellipse at center, #0a0a18 0%, #030308 100%);
    overflow: hidden;
  }
  #space-bg .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }
  #space-bg svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  #space-bg .orbit-ring { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 1; }
  #space-bg .earth-dot {
    animation: earth-dot-blink 1.8s ease-in-out infinite;
    transform-box: fill-box; transform-origin: center;
  }
  @keyframes earth-dot-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #space-bg .planet-label {
    fill: rgba(255,255,255,0.55); font-size: 8px; font-family: monospace;
  }

  /* "Zooming into Earth" transition, played when opening a chat */
  .earth-zoom-overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: #030308;
    pointer-events: none;
    animation: earth-zoom-fade 750ms ease-in forwards;
  }
  .earth-zoom-circle {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7ec8ff, #1e5fbf 55%, #0a1a3a 100%);
    box-shadow: 0 0 25px 6px rgba(59,130,246,0.55);
    animation: earth-zoom-in 700ms cubic-bezier(0.65,0,0.35,1) forwards;
  }
  @keyframes earth-zoom-in {
    0% { transform: scale(1); }
    100% { transform: scale(90); }
  }
  @keyframes earth-zoom-fade {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; }
  }

  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }
  .centered {
    align-items: center;
    justify-content: center;
  }
  h2 { text-align: center; }
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 90%;
    max-width: 340px;
    margin: 0 auto;
  }
  input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    font-size: 16px;
    width: 100%;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  .link-btn {
    background: none;
    color: #60a5fa;
    text-decoration: underline;
    padding: 4px;
  }
  .error { color: #f87171; text-align: center; min-height: 20px; font-size: 14px; }

  /* Chat screen */
  #chat-header {
    padding: 12px 16px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 15px;
  }
  .msg.mine {
    align-self: flex-end;
    background: #3b82f6;
  }
  .msg.theirs {
    align-self: flex-start;
    background: #2a2a2a;
  }
  .msg-time {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 3px;
    text-align: right;
  }
  .msg-sender-name {
    font-size: 11px;
    color: #93c5fd;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .msg-system {
    align-self: center;
    max-width: 85%;
    text-align: center;
    color: #999;
    font-size: 13px;
    font-style: italic;
    padding: 6px 14px;
    background: #1c1c1c;
    border-radius: 10px;
    margin: 4px 0;
  }
  #message-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #333;
    width: 100%;
    max-width: none;
    margin: 0;
    flex-shrink: 0;
  }
  #message-input { flex: 1; }
  #call-btn { width: auto; background: #16a34a; }
  #group-call-btn { width: auto; padding: 12px 14px; background: #7c3aed; }
  #group-call-btn:hover { background: #6d28d9; }
  #call-btn:hover { background: #15803d; }

  /* Call screen */
  #call-screen-inner { position: relative; width: 100%; height: 100%; }
  #remote-video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #local-video {
    position: absolute; bottom: 20px; right: 20px;
    width: 130px; border-radius: 10px; border: 2px solid #fff; background: #000;
    cursor: grab; touch-action: none;
  }
  #local-video.mirrored, #group-local-video.mirrored { transform: scaleX(-1); }
  /* Square gets a visible inset margin — otherwise, on a full-screen 1:1
     remote video, an unclipped rectangle looks identical to "no shape". */
  .shape-circle { clip-path: circle(50% at 50% 50%); border-radius: 50% !important; }
  .shape-square { clip-path: inset(12% round 16px); border-radius: 0 !important; }
  .shape-star {
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    border-radius: 0 !important;
  }
  .shape-oval-v { clip-path: ellipse(35% 50% at 50% 50%); border-radius: 0 !important; }
  .shape-oval-h { clip-path: ellipse(50% 35% at 50% 50%); border-radius: 0 !important; }
  .shape-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-radius: 0 !important; }
  .shape-hexagon {
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    border-radius: 0 !important;
  }
  .shape-emoji { clip-path: none; border-radius: 0 !important; background: transparent !important; }
  .shape-none { clip-path: none !important; border-radius: 0 !important; }

  #shape-picker-modal, #status-planet-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; z-index: 30;
    padding: 20px;
  }
  #shape-picker-modal.active, #status-planet-modal.active { display: flex; }
  #shape-picker-box {
    background: #1a1a1a; border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; width: 300px;
  }
  .shape-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .shape-options button { background: #2a2a2a; padding: 12px 8px; font-size: 14px; }
  .shape-options button:hover { background: #333; }
  #call-status {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px; font-size: 14px;
  }
  #call-duration, #group-call-duration {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px;
    font-size: 14px; font-family: monospace; z-index: 6;
  }
  #debug-status {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px;
    font-size: 11px; color: #9ca3af; font-family: monospace; text-align: right;
    line-height: 1.4;
  }
  #call-controls, .call-controls-bar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px;
  }
  #call-controls button, .call-controls-bar button {
    width: 52px; height: 52px; border-radius: 50%; padding: 0;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    background: #333;
  }
  #call-controls button:hover, .call-controls-bar button:hover { background: #444; }
  #call-controls button.active-off, .call-controls-bar button.active-off { background: #dc2626; }
  #call-controls button.active-off:hover, .call-controls-bar button.active-off:hover { background: #b91c1c; }
  #call-controls button.ctrl-green, .call-controls-bar button.ctrl-green { background: #16a34a; }
  #call-controls button.ctrl-green:hover, .call-controls-bar button.ctrl-green:hover { background: #15803d; }
  #call-controls button.ctrl-neutral, .call-controls-bar button.ctrl-neutral { background: #555; }
  #call-controls button.ctrl-neutral:hover, .call-controls-bar button.ctrl-neutral:hover { background: #444; }
  #call-controls button.ctrl-green.active-off, .call-controls-bar button.ctrl-green.active-off { background: #dc2626; }
  #call-controls button.ctrl-green.active-off:hover, .call-controls-bar button.ctrl-green.active-off:hover { background: #b91c1c; }
  #hangup, #group-hangup { background: #dc2626 !important; }
  #hangup:hover { background: #b91c1c !important; }

  /* Call-type chooser */
  #call-type-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #call-type-modal.active { display: flex; }
  #call-type-box {
    background: #1a1a1a; border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; width: 260px;
  }
  #call-type-box button { background: #2a2a2a; }
  #call-type-box button:hover { background: #333; }

  #incoming-call-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #incoming-call-modal.active { display: flex; }
  #incoming-call-box, .incoming-call-box-style {
    background: #1a1a1a; border-radius: 12px; padding: 24px;
    display: flex; flex-direction: column; gap: 16px; width: 280px; text-align: center;
  }
  #incoming-call-box button, .incoming-call-box-style button { flex: 1; padding: 14px; }

  /* Group call selection modal */
  #group-select-modal, #group-invite-modal, #add-participant-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; z-index: 25;
    padding: 20px;
  }
  #group-select-modal.active, #group-invite-modal.active, #add-participant-modal.active { display: flex; }
  #group-select-box, .group-select-box-style {
    background: #1a1a1a; border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; width: 320px; max-height: 85vh; overflow-y: auto;
  }
  #group-select-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .group-select-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; background: #222; cursor: pointer;
  }
  .group-select-item.checked { background: #1e3a5f; }
  .group-select-item input { width: auto; }

  /* Group call tiles */
  #group-call-inner { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #group-call-status {
    position: absolute; top: 16px; left: 16px; z-index: 5;
    background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px; font-size: 14px;
  }
  #group-tiles {
    width: 100%; height: 100%;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 10px; padding: 10px;
  }
  .group-tile {
    position: relative;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 150ms ease-out;
    transform-origin: center;
  }
  .group-tile.speaking {
    transform: scale(1.15);
    z-index: 9;
  }
  #group-local-video.speaking {
    transform: scale(1.15);
  }
  #group-local-video.speaking.mirrored {
    transform: scale(1.15) scaleX(-1);
  }
  .group-tile video {
    width: 100%; height: 100%; object-fit: cover;
    background: #000;
  }
  .group-tile-name {
    position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); padding: 2px 10px; border-radius: 10px;
    font-size: 12px; white-space: nowrap;
  }
  #group-local-video {
    position: absolute; bottom: 20px; right: 20px;
    width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
    border: 2px solid #fff; background: #000; z-index: 5;
    cursor: grab; touch-action: none;
  }

  /* Group call reactions */
  #group-reactions-layer {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 8;
  }
  .floating-reaction {
    position: absolute;
    bottom: 90px;
    font-size: 40px;
    animation: float-up 2.2s ease-out forwards;
  }
  @keyframes float-up {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    15% { transform: translateY(-20px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-260px) scale(1); opacity: 0; }
  }
  #reaction-picker {
    position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: #1a1a1a; border-radius: 30px; padding: 8px 10px;
    display: none; gap: 4px; z-index: 15; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #reaction-picker.active { display: flex; }
  #reaction-picker button {
    width: 40px; height: 40px; border-radius: 50%; padding: 0;
    font-size: 20px; background: transparent;
  }
  #reaction-picker button:hover { background: #2a2a2a; }
  .top-nav { display: flex; gap: 8px; align-items: center; }
  .top-nav button { padding: 6px 12px; font-size: 14px; }

  .contact-item {
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    border-bottom: 1px solid #222;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .contact-item:hover { background: #1a1a1a; }
  .contact-name { font-weight: 600; font-size: 16px; }
  .contact-name-row { display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #555; }
  .status-dot.online { animation: dot-blink 1.6s ease-in-out infinite; }
  @keyframes dot-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .contact-preview { color: #999; font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-state { text-align: center; color: #666; padding: 40px 20px; font-size: 14px; }
  #chat-with-status { display: flex; align-items: center; }
</style>
</head>
<body>

<div id="space-bg"></div>
<script>
// Space background: Sun + 8 planets at their actual current angular
// position, computed from simplified circular-orbit elements (mean
// longitude at J2000 + orbital period). This ignores orbital eccentricity,
// so it's accurate to within a few degrees — good enough for decoration,
// not for navigation. Distances use a compressed log scale for visibility:
// Neptune is genuinely ~78x farther from the Sun than Mercury is, which
// can't be shown at true linear scale on a screen.
(function renderSpaceBg() {
  const PLANETS = [
    { name: 'Меркурий', color: '#b1adad', period: 87.969,   L0: 252.25, a: 0.387 },
    { name: 'Венера',   color: '#e6c229', period: 224.701,  L0: 181.98, a: 0.723 },
    { name: 'Земля',    color: '#3b82f6', period: 365.256,  L0: 100.47, a: 1.000 },
    { name: 'Марс',     color: '#c1440e', period: 686.980,  L0: 355.45, a: 1.524 },
    { name: 'Юпитер',   color: '#d9a066', period: 4332.589, L0: 34.40,  a: 5.203 },
    { name: 'Сатурн',   color: '#e3c16f', period: 10759.22, L0: 49.94,  a: 9.537 },
    { name: 'Уран',     color: '#7fd4e0', period: 30688.5,  L0: 313.23, a: 19.191 },
    { name: 'Нептун',   color: '#3f54ba', period: 60182,    L0: 304.88, a: 30.069 }
  ];

  function daysSinceJ2000() {
    const j2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
    return (Date.now() - j2000) / 86400000;
  }

  function planetAngle(p, days) {
    const angle = (p.L0 + 360 * (days / p.period)) % 360;
    return angle < 0 ? angle + 360 : angle;
  }

  const container = document.getElementById('space-bg');

  for (let i = 0; i < 90; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 0.5;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = (Math.random() * 3) + 's';
    container.appendChild(star);
  }

  const days = daysSinceJ2000();
  const size = 320;
  const cx = size / 2, cy = size / 2;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="7" fill="#ffd76a" opacity="0.9"/>`;

  PLANETS.forEach(p => {
    const r = 20 + 34 * Math.log10(p.a * 10 + 1);
    svg += `<circle class="orbit-ring" cx="${cx}" cy="${cy}" r="${r}"/>`;
    const angleRad = (planetAngle(p, days) - 90) * Math.PI / 180;
    const px = cx + r * Math.cos(angleRad);
    const py = cy + r * Math.sin(angleRad);
    const dotSize = (p.name === 'Юпитер' || p.name === 'Сатурн') ? 3.5 : 2.2;
    const isEarth = p.name === 'Земля';
    svg += `<circle class="${isEarth ? 'earth-dot' : ''}" cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="${dotSize}" fill="${p.color}"><title>${p.name}</title></circle>`;
  });

  svg += `</svg>`;
  container.insertAdjacentHTML('beforeend', svg);
})();
</script>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen active centered">
  <form id="auth-form">
    <h2 id="auth-title" style="text-align:center; font-size:36px;">🔓</h2>
    <input id="username-input" type="text" placeholder="👤" autocomplete="username" required>
    <input id="password-input" type="password" placeholder="🔒" autocomplete="current-password" required>
    <button type="submit" id="auth-submit">➤</button>
    <button type="button" class="link-btn" id="toggle-auth" style="font-size:20px; text-decoration:none;">🔄</button>
    <div class="error" id="auth-error"></div>
  </form>
</div>

<!-- CONTACT SCREEN -->
<div id="contact-screen" class="screen">
  <div style="padding:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:22px;">💬</span>
      <button type="button" id="my-status-btn" title="status" style="width:auto; background:none; padding:4px; display:flex; align-items:center;"><span id="my-status-dot" class="status-dot online" style="width:14px;height:14px;"></span></button>
    </div>
    <button type="button" id="logout-btn" style="width:auto; background:none; font-size:22px; padding:4px;">🖐️</button>
  </div>
  <div id="contacts-list" style="flex:1; overflow-y:auto; padding:8px 0;">
    <div id="dm-contacts-list"></div>
    <div id="group-chats-divider" style="display:none; padding:10px 16px 4px; font-size:14px; color:#666;">👥💬</div>
    <div id="group-chats-list"></div>
  </div>
  <div id="contact-error" style="text-align:center; color:#f87171; font-size:13px; padding:0 12px; min-height:16px;"></div>
  <form id="contact-form" style="padding:12px; border-top:1px solid #333; flex-direction:row; gap:8px; margin:0; max-width:none;">
    <input id="contact-input" type="text" placeholder="👤+" style="flex:1;" required>
    <button type="submit" style="width:auto;">➕</button>
  </form>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen" class="screen">
  <div id="chat-header">
    <div class="top-nav">
      <button id="back-btn">←</button>
      <div>
        <div id="chat-with"></div>
        <div id="chat-with-status"></div>
      </div>
    </div>
    <div style="display:flex; gap:6px;">
      <button id="group-call-btn">👥</button>
      <button id="call-btn">📞</button>
      <button id="group-chat-call-btn" style="display:none;">📞</button>
    </div>
  </div>
  <div id="messages"></div>
  <form id="message-form">
    <input id="message-input" type="text" placeholder="💬" autocomplete="off">
    <button type="submit">➤</button>
  </form>
</div>

<!-- GROUP CALL PARTICIPANT SELECTION MODAL -->
<div id="group-select-modal">
  <div id="group-select-box">
    <h2 style="margin-top:0; text-align:center;">👥📞</h2>
    <div id="group-select-list"></div>
    <div style="display:flex; gap:8px;">
      <input id="group-select-input" type="text" placeholder="👤+" style="flex:1;" onkeydown="if(event.key==='Enter'){event.preventDefault(); document.getElementById('group-select-add-btn').click();}">
      <button id="group-select-add-btn" style="width:auto;">➕</button>
    </div>

// ---------- Helpers ----------
function show(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

}
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}
function clientRoomFor(a, b) {
  return [a, b].sort().join('___');
}

let groupCallDegreeInterval = null;
// Earth's real sidereal rotation rate (360° per sidereal day, 86164.0905s)
const EARTH_DEG_PER_SEC = 360 / 86164.0905;

function startDegreeCounter(elId, getStartTime) {
  const el = document.getElementById(elId);
  el.style.display = 'block';
  const update = () => {
    const start = getStartTime();
    if (!start) return;
    const deg = ((Date.now() - start) / 1000) * EARTH_DEG_PER_SEC;
    el.textContent = `🌍 ${deg.toFixed(3)}°`;
  };
  update();
  return setInterval(update, 100);
}

function totalDegreesRotated(startTime) {
  if (!startTime) return 0;
  return ((Date.now() - startTime) / 1000) * EARTH_DEG_PER_SEC;
}

// ---------- Group call state ----------
let currentCallId = null;
let groupLocalStream = null;

let groupPendingCandidates = new Map(); // username -> [candidates]

// ---------- Auth ----------

  const endpoint = isRegisterMode ? '/api/register' : '/api/login';

async function loadContacts() {
  const listEl = document.getElementById('dm-contacts-list');
  listEl.innerHTML = '<div class="empty-state">⏳</div>';
  const res = await fetch('/api/contacts');
  const contacts = await res.json();
  if (contacts.length === 0) {
    listEl.innerHTML = '<div class="empty-state">💬∅</div>';
  } else {
    listEl.innerHTML = '';
    contacts.forEach(c => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      const prefix = c.lastSender === me ? '➤ ' : '';
      div.innerHTML = `<div class="contact-name-row">${planetDotHtml(c.contact)}<div class="contact-name">${escapeHtml(c.contact)}</div></div><div class="contact-preview">${escapeHtml(prefix + previewText(c))}</div>`;

      let longPressTimer = null;
      let longPressFired = false;

      div.onclick = () => {
        if (longPressFired) { longPressFired = false; return; }
        openChat(c.contact);
      };

      // Desktop: right-click
      div.oncontextmenu = (e) => {
        e.preventDefault();
        confirmDeleteChat(c.contact);
      };

      // Mobile: long-press
      div.addEventListener('touchstart', () => {
        longPressFired = false;
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          if (navigator.vibrate) navigator.vibrate(30);
          confirmDeleteChat(c.contact);
        }, 550);
      });
      div.addEventListener('touchend', () => clearTimeout(longPressTimer));
      div.addEventListener('touchmove', () => clearTimeout(longPressTimer));

      listEl.appendChild(div);
    });
  }
  await loadGroupChats();
}

async function loadGroupChats() {
  const listEl = document.getElementById('group-chats-list');
  const dividerEl = document.getElementById('group-chats-divider');
  if (!me) return; // not logged in yet
  const res = await fetch('/api/group-chats');
  const chats = await res.json();
  if (chats.length === 0) {
    dividerEl.style.display = 'none';
    listEl.innerHTML = '';
    return;
  }
  dividerEl.style.display = 'block';
  listEl.innerHTML = '';
  chats.forEach(gc => {
    const div = document.createElement('div');
    div.className = 'contact-item';
    const others = (gc.members || []).filter(u => u !== me);
    const namesLine = others.join(', ');
    const prefix = gc.last_sender === me ? '➤ ' : (gc.last_sender === '__system__' ? '' : '');
    div.innerHTML = `<div class="contact-name-row"><span style="font-size:14px;">👥</span><div class="contact-name">${escapeHtml(namesLine)}</div></div><div class="contact-preview">${escapeHtml(prefix + (gc.last_body || ''))}</div>`;
    div.onclick = () => openGroupChat(gc.id, others);
    listEl.appendChild(div);
  });
}

async function confirmDeleteChat(contact) {
  if (!confirm(`🗑️ ${contact}?`)) return;

}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function previewText(c) {
  if (!c.lastBody) return '';
  const audMatch = c.lastBody.match(/^§AUD:([^§]+)§([\s\S]*)$/);
  if (audMatch) {
    const [, audience, text] = audMatch;
    return audience === me ? text : '';
  }
  return c.lastBody;
}

// ---------- Push notifications ----------
async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.log('[push] not supported in this browser');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    console.log('[push] service worker ready');

    const keyRes = await fetch('/api/vapid-public-key');
    const { key } = await keyRes.json();
    if (!key) {
      console.log('[push] no VAPID key from server — is it set on Render?');
      return;
    }

    const permission = await Notification.requestPermission();
    console.log('[push] permission:', permission);
    if (permission !== 'granted') return;

    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(key)
      });
      console.log('[push] created new subscription');
    } else {
      console.log('[push] reusing existing subscription');
    }
    const saveRes = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub)
    });
    console.log('[push] subscription saved on server:', saveRes.ok);
  } catch (err) {
    console.warn('[push] setup failed', err);
  }
}

// ---------- Socket ----------
function connectSocket() {
  socket = io();

  socket.on('connect', () => {
    console.log('[socket] connected', socket.id);
  });
  socket.on('disconnect', (reason) => {
    console.log('[socket] disconnected:', reason);
  });
  socket.io.on('reconnect_attempt', (attempt) => {
    console.log('[socket] reconnect attempt', attempt);
  });
  socket.io.on('reconnect', (attempt) => {
    console.log('[socket] reconnected after', attempt, 'attempts');
  });

  socket.on('chat-message', ({ sender, body, created_at, room }) => {
    if (currentContact && room === clientRoomFor(me, currentContact)) {
      addMessageToUI(sender, body, created_at);
    }
    if (sender !== me && sender !== '__system__') {
      playNotificationBeep();
    }
  });

  socket.on('group-chat-message', ({ groupChatId, sender, body, created_at }) => {
    if (currentGroupChatId && groupChatId === currentGroupChatId) {
      addMessageToUI(sender, body, created_at, true);
    }
    if (sender !== me && sender !== '__system__') {
      playNotificationBeep();
    }
  });

  socket.on('group-chat-updated', () => {
    if (!document.getElementById('contact-screen').classList.contains('active')) return;
    loadGroupChats();
  });

  socket.on('incoming-call', ({ from, video }) => {
    showIncomingCallScreen(from, !!video);
  });

  socket.on('signal', async ({ from, data }) => {
    if (!peerConnection) {
      // Peer connection doesn't exist yet (e.g. user hasn't answered the
      // incoming-call prompt yet) — queue it instead of dropping it.
      pendingSignals.push({ from, data });
      return;
    }
    await processSignal(from, data);
  });

  socket.on('call-ended', () => {
    stopIncomingAlert();
    document.getElementById('incoming-call-modal').classList.remove('active');
    pendingSignals = [];
    if (inCall) endCall(false);
  });

  // The person we called just came online (e.g. they opened the app from
  // the push notification) — if we're still waiting, send them a fresh
  // offer instead of leaving them with nothing to answer.
  socket.on('callee-reconnected', async ({ contact }) => {
    if (!(inCall && callIAmCaller && currentContact === contact && peerConnection)) return;
    if (peerConnection.connectionState === 'connected') return;
    try {
      remoteDescSet = false;
      pendingCandidates = [];
      const offer = await peerConnection.createOffer({ iceRestart: true });
      await peerConnection.setLocalDescription(offer);
      socket.emit('signal', { contact, data: peerConnection.localDescription });
      clearTimeout(connectTimeoutId);
      connectTimeoutId = setTimeout(() => {
        if (inCall && peerConnection && peerConnection.connectionState !== 'connected') {
          endCall(true);
          alert('📡✖');
        }
      }, 45000);
    } catch (e) {
      console.warn('Failed to resend offer after callee reconnected', e);
    }
  });

  // --- Group calls ---
  socket.on('group-call-invite', ({ callId, from, video }) => {
    showGroupInviteScreen(callId, from, !!video);
  });

  socket.on('group-participant-joined', ({ callId, username }) => {
    if (callId !== currentCallId) return;
    // A newcomer will send us an offer shortly — make sure a peer
    // connection exists and is ready to receive it (passive side).
    getOrCreateGroupPeer(username);
    addGroupTile(username);
  });

  socket.on('group-signal', async ({ callId, from, data }) => {
    if (callId !== currentCallId) return;
    await processGroupSignal(from, data);
  });

  socket.on('group-participant-left', ({ callId, username }) => {
    if (callId !== currentCallId) return;
    removeGroupParticipant(username);
  });

  socket.on('video-shape', ({ from, shape }) => {
    applyShapeToElement(document.getElementById('remote-video'), shape);
  });

  socket.on('group-video-shape', ({ from, shape }) => {
    const tile = document.getElementById('tile-' + from);
    if (tile) applyShapeToElement(tile.querySelector('video'), shape);
  });

  socket.on('group-reaction', ({ from, emoji }) => {
    showFloatingReaction(from, emoji);
  });

  socket.on('presence', ({ username, online, planet }) => {
    if (online) onlineUsernames.set(username, planet || onlineUsernames.get(username) || 'earth');
    else onlineUsernames.delete(username);
    updatePresenceUI(username);
  });
}

function planetDotHtml(username, extraClass) {

// NOTE: these two must be in the top-level (global) scope, not nested
// inside connectSocket() — startCall() also needs to call processSignal
// when flushing messages that arrived before peerConnection existed.
// They were previously nested inside connectSocket, which made them
// undefined from startCall's point of view and silently dropped the
// very first offer/answer of a call — the root cause of calls hanging
// on "соединяем..." forever.
async function processSignal(from, data) {
  if (data.type === 'offer') {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
    remoteDescSet = true;
    await flushPendingCandidates();
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('signal', { contact: from, data: peerConnection.localDescription });
  } else if (data.type === 'answer') {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
    remoteDescSet = true;
    await flushPendingCandidates();
  } else if (data.candidate) {
    // If the remote description isn't set yet, queue the candidate —
    // adding it too early throws and silently drops it, which is what
    // was causing calls to randomly fail to connect.
    if (remoteDescSet) {
      try { await peerConnection.addIceCandidate(new RTCIceCandidate(data)); } catch (e) {}
    } else {
      pendingCandidates.push(data);
    }
  }
}

async function flushPendingCandidates() {
  for (const c of pendingCandidates) {
    try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
  pendingCandidates = [];
}

function addMessageToUI(sender, body, createdAt, showSenderName) {
  const div = document.createElement('div');

  if (sender === '__system__') {
    // System messages can be addressed to just one side of the chat
    // (e.g. "you missed a call" vs "please wait, they'll answer") using
    // a "§AUD:username§text" prefix. If it's not meant for me, skip it.
    let text = body;
    const audMatch = body.match(/^§AUD:([^§]+)§([\s\S]*)$/);
    if (audMatch) {
      const [, audience, actualText] = audMatch;
      if (audience !== me) return;
      text = actualText;
    }
    div.className = 'msg-system';
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    return;
  }

  div.className = 'msg ' + (sender === me ? 'mine' : 'theirs');

  if (showSenderName && sender !== me) {
    const nameDiv = document.createElement('div');
    nameDiv.className = 'msg-sender-name';
    nameDiv.textContent = sender;
    div.appendChild(nameDiv);
  }

  const textDiv = document.createElement('div');
  textDiv.textContent = body;
  div.appendChild(textDiv);

  const timeDiv = document.createElement('div');
  timeDiv.className = 'msg-time';
  timeDiv.textContent = formatMessageTime(createdAt);
  div.appendChild(timeDiv);

  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function earthOrbitAngle(timestampMs) {
  // Earth's position along its own orbit around the Sun (0-360°), computed
  // from the same simplified circular-orbit model as the space background —
  // real astronomy (mean longitude + orbital period), not decorative fluff.
  const j2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
  const days = (timestampMs - j2000) / 86400000;
  const period = 365.256;
  const L0 = 100.47;
  let angle = (L0 + 360 * (days / period)) % 360;
  if (angle < 0) angle += 360;
  return angle;
}

function formatMessageTime(createdAt) {
  const d = createdAt ? new Date(createdAt) : new Date();
  return `🌍 ${earthOrbitAngle(d.getTime()).toFixed(3)}°`;
}

// ---------- Ringtone: cosmic "searching for signal" transmission ----------
// No audio file needed — synthesized live with the Web Audio API. Sweeps
// DOWN in pitch (unlike the group call's upward sonar ping in
// startSpaceRingtone), so the two are easy to tell apart by ear.
let ringtoneCtx = null;
let ringtoneTimers = [];
let ringtonePlaying = false;

function signalBlip(ctx, time, baseFreq, duration, volume) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  osc.type = 'sawtooth';
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2200, time);
  osc.frequency.setValueAtTime(baseFreq, time);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.45, time + duration);

  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(volume, time + duration * 0.12);
  gain.gain.linearRampToValueAtTime(0, time + duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(time);
  osc.stop(time + duration);
}

function scheduleSignalSearch() {
  if (!ringtonePlaying || !ringtoneCtx) return;
  const now = ringtoneCtx.currentTime;

  // Two quick descending blips, like a radio scanning through frequencies
  signalBlip(ringtoneCtx, now, 1500, 0.28, 0.07);
  signalBlip(ringtoneCtx, now + 0.34, 1100, 0.22, 0.06);

  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

  const nextIn = 1.3 + Math.random() * 0.3;
  ringtoneTimers.push(setTimeout(scheduleSignalSearch, nextIn * 1000));
}

function startRingtone() {
  if (ringtonePlaying) return;
  try {
    ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
    ringtonePlaying = true;
    scheduleSignalSearch();
  } catch (e) {
    console.warn('Ringtone unavailable', e);
  }
}

function stopRingtone() {
  ringtonePlaying = false;
  ringtoneTimers.forEach(t => clearTimeout(t));
  ringtoneTimers = [];
  if (ringtoneCtx) {
    ringtoneCtx.close();
    ringtoneCtx = null;
  }
}

// ---------- Space "ping" ringtone — used while a GROUP call is connecting ----------
let spaceRingtoneCtx = null;
let spaceRingtoneTimers = [];
let spaceRingtonePlaying = false;

function spacePing(ctx, time) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(480, time);
  osc.frequency.exponentialRampToValueAtTime(1100, time + 0.28);
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.12, time + 0.03);
  gain.gain.linearRampToValueAtTime(0, time + 0.32);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(time);
  osc.stop(time + 0.34);
}

function scheduleSpacePing() {
  if (!spaceRingtonePlaying || !spaceRingtoneCtx) return;
  spacePing(spaceRingtoneCtx, spaceRingtoneCtx.currentTime);
  if (navigator.vibrate) navigator.vibrate([70]);
  spaceRingtoneTimers.push(setTimeout(scheduleSpacePing, 1100));
}

function startSpaceRingtone() {
  if (spaceRingtonePlaying) return;
  try {
    spaceRingtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
    spaceRingtonePlaying = true;
    scheduleSpacePing();
  } catch (e) {}
}

function stopSpaceRingtone() {
  spaceRingtonePlaying = false;
  spaceRingtoneTimers.forEach(t => clearTimeout(t));
  spaceRingtoneTimers = [];
  if (spaceRingtoneCtx) {
    spaceRingtoneCtx.close();

  }
}

// ---------- Incoming-call alert — played to the person being called,
// distinct from the ringtone the caller hears while waiting ----------
let incomingAlertCtx = null;
let incomingAlertTimers = [];
let incomingAlertPlaying = false;

function incomingBeepTriplet(ctx, time) {
  [0, 0.16, 0.32].forEach(offset => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1300, time + offset);
    gain.gain.setValueAtTime(0, time + offset);
    gain.gain.linearRampToValueAtTime(0.1, time + offset + 0.02);
    gain.gain.linearRampToValueAtTime(0, time + offset + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(time + offset);
    osc.stop(time + offset + 0.13);
  });
}

function scheduleIncomingAlert() {
  if (!incomingAlertPlaying || !incomingAlertCtx) return;
  incomingBeepTriplet(incomingAlertCtx, incomingAlertCtx.currentTime);
  if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 150]);
  incomingAlertTimers.push(setTimeout(scheduleIncomingAlert, 1700));
}

function startIncomingAlert() {
  if (incomingAlertPlaying) return;
  try {
    incomingAlertCtx = new (window.AudioContext || window.webkitAudioContext)();
    incomingAlertPlaying = true;
    scheduleIncomingAlert();
  } catch (e) {}
}

function stopIncomingAlert() {
  incomingAlertPlaying = false;

}

// ---------- New message notification: high-pitched beep + vibration ----------
function playNotificationBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1800, ctx.currentTime);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.01);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.13);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.14);
    osc.onended = () => ctx.close();
  } catch (e) {}

  if (navigator.vibrate) navigator.vibrate([120]);
}

async function startCall(isCaller, withVideo) {
  if (inCall) {
    // A previous call attempt is stuck (never properly connected or
    // cleaned up) — reset everything instead of silently ignoring the
    // new attempt, which is what made retries look broken.
    endCall(true);
  }
  inCall = true;
  isMuted = false;
  isVideoOff = false;
  remoteDescSet = false;
  pendingCandidates = [];
  callIAmCaller = isCaller;
  callWasConnected = false;
  show('call-screen');
  document.getElementById('call-status').style.display = 'block';
  document.getElementById('call-status').textContent = isCaller ? '📡➤' : '📡';
  startRingtone();

  const videoToggleBtn = document.getElementById('video-toggle-btn');
  document.getElementById('mute-btn').textContent = '😸';
  videoToggleBtn.textContent = '💅';
  document.getElementById('mute-btn').classList.remove('active-off');
  videoToggleBtn.classList.remove('active-off');
  document.getElementById('camera-switch-btn').style.display = withVideo ? 'flex' : 'none';

  localStream = await navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true });
  document.getElementById('local-video').srcObject = localStream;
  document.getElementById('local-video').style.display = withVideo ? 'block' : 'none';
  resetLocalVideoPosition(document.getElementById('local-video'));
  applyShapeToElement(document.getElementById('local-video'), 'square');
  document.getElementById('local-video').classList.toggle('mirrored', currentFacingMode === 'user');

  peerConnection = new RTCPeerConnection(config);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = (event) => {
    document.getElementById('remote-video').srcObject = event.streams[0];
    document.getElementById('call-status').style.display = 'none';
    clearTimeout(connectTimeoutId);
    stopRingtone();
  };

  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('signal', { contact: currentContact, data: event.candidate });
    }
  };

  peerConnection.onconnectionstatechange = () => {
    if (!peerConnection) return;
    updateDebugStatus();
    console.log('[pc] connectionState:', peerConnection.connectionState);
    if (peerConnection.connectionState === 'connected') {
      document.getElementById('call-status').style.display = 'none';
      clearTimeout(connectTimeoutId);
      stopRingtone();
      if (!callWasConnected) {
        callWasConnected = true;
        callStartTime = Date.now();
        clearInterval(callDegreeInterval);
        callDegreeInterval = startDegreeCounter('call-duration', () => callStartTime);
      }
    } else if (['failed', 'disconnected', 'closed'].includes(peerConnection.connectionState)) {
      document.getElementById('call-status').style.display = 'block';
      document.getElementById('call-status').textContent = '📡✖';
      stopRingtone();
    }
  };

  peerConnection.oniceconnectionstatechange = () => {
    if (!peerConnection) return;
    updateDebugStatus();
    console.log('[pc] iceConnectionState:', peerConnection.iceConnectionState);
  };

  peerConnection.onsignalingstatechange = () => {
    if (!peerConnection) return;
    updateDebugStatus();
    console.log('[pc] signalingState:', peerConnection.signalingState);
  };

  peerConnection.onicegatheringstatechange = () => {
    if (!peerConnection) return;
    updateDebugStatus();
  };

  // Process any signaling messages (offer/candidates) that arrived while
  // this device hadn't answered yet and peerConnection didn't exist.
  const queued = pendingSignals;
  pendingSignals = [];
  for (const { from, data } of queued) {
    await processSignal(from, data);
  }

  if (isCaller) {
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('signal', { contact: currentContact, data: peerConnection.localDescription });
  }

  // Safety net: if it never connects, don't leave the call stuck forever —
  // that's what made every retry after the first one silently do nothing.
  // Long enough to cover "they got a push notification and need to open
  // the app" (that whole flow can easily take 20-30s on its own).
  clearTimeout(connectTimeoutId);
  connectTimeoutId = setTimeout(() => {
    if (inCall && peerConnection && peerConnection.connectionState !== 'connected') {
      endCall(true);
      alert('📡✖');
    }
  }, 45000);
}

// Handles both: toggling an existing camera track on/off, and turning the
// camera on for the first time during an audio-only call (adds a new
// video track and renegotiates the connection).
document.getElementById('video-toggle-btn').onclick = async () => {
  if (!localStream || !peerConnection) return;
  const videoTracks = localStream.getVideoTracks();

  if (videoTracks.length === 0) {
    // No camera track yet (this was an audio-only call) — add one now.
    try {
      const camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
      const videoTrack = camStream.getVideoTracks()[0];
      localStream.addTrack(videoTrack);
      peerConnection.addTrack(videoTrack, localStream);

      document.getElementById('local-video').style.display = 'block';
      document.getElementById('local-video').classList.toggle('mirrored', currentFacingMode === 'user');
      document.getElementById('camera-switch-btn').style.display = 'flex';
      const btn = document.getElementById('video-toggle-btn');
      btn.textContent = '💅';
      btn.classList.remove('active-off');
      isVideoOff = false;

      // Adding a track after the call started requires renegotiating
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('signal', { contact: currentContact, data: peerConnection.localDescription });
    } catch (err) {
      alert('📷✖');
    }
    return;
  }

  isVideoOff = !isVideoOff;
  videoTracks.forEach(t => t.enabled = !isVideoOff);
  const btn = document.getElementById('video-toggle-btn');
  btn.textContent = isVideoOff ? '😾' : '💅';
  btn.classList.toggle('active-off', isVideoOff);
  document.getElementById('local-video').style.display = isVideoOff ? 'none' : 'block';
};

// ---------- Switch front/back camera ----------
let currentFacingMode = 'user';

document.getElementById('camera-switch-btn').onclick = async () => {
  if (!localStream || !peerConnection) return;
  const videoTracks = localStream.getVideoTracks();
  if (videoTracks.length === 0) return;

  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode }
    });
    const newTrack = newStream.getVideoTracks()[0];

    // Swap the track being sent to the other person...
    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) await sender.replaceTrack(newTrack);

    // ...and the track shown in our own local preview
    const oldTrack = videoTracks[0];
    localStream.removeTrack(oldTrack);
    oldTrack.stop();
    localStream.addTrack(newTrack);
    document.getElementById('local-video').srcObject = localStream;
    document.getElementById('local-video').classList.toggle('mirrored', currentFacingMode === 'user');
  } catch (err) {
    // Some devices (most laptops) only have one camera and will fail here
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; // revert
    alert('🔄📷✖');
  }
};

function endCall(notifyServer) {
  const wasInCall = inCall;
  const degreesRotated = callWasConnected ? totalDegreesRotated(callStartTime) : 0;
  clearInterval(callDegreeInterval);
  callDegreeInterval = null;
  callStartTime = null;
  document.getElementById('call-duration').style.display = 'none';
  clearTimeout(connectTimeoutId);
  stopRingtone();
  inCall = false;
  remoteDescSet = false;
  pendingCandidates = [];
  pendingSignals = [];
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById('remote-video').srcObject = null;
  document.getElementById('debug-status').textContent = '';
  document.getElementById('call-status').style.display = 'block';
  document.getElementById('call-status').textContent = '📞';
  if (notifyServer && currentContact) {
    socket.emit('call-ended', { contact: currentContact });
  }

  // Leave a note in the chat about how the call went — only the caller
  // does this, so we don't get a duplicate note from both sides. Missed
  // calls get a different message per side (audience-tagged so only the
  // intended person sees it in their view of the shared chat).
  if (wasInCall && callIAmCaller && currentContact) {
    if (callWasConnected) {
      socket.emit('system-message', {
        contact: currentContact,
        body: `📞✅😊 🌍${degreesRotated.toFixed(3)}°`
      });
    } else {
      socket.emit('system-message', {
        contact: currentContact,
        body: `§AUD:${currentContact}§📞✖😢`
      });
      socket.emit('system-message', {
        contact: currentContact,
        body: `§AUD:${me}§📞⏳😊`
      });
    }
  }

  show('chat-screen');
}

async function setupGroupLocalMedia(withVideo) {
  groupHasVideo = withVideo;
  groupIsMuted = false;
  groupIsVideoOff = false;
  groupLocalStream = await navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true });

  const localVideoEl = document.getElementById('group-local-video');
  localVideoEl.srcObject = groupLocalStream;
  localVideoEl.style.display = withVideo ? 'block' : 'none';
  resetLocalVideoPosition(localVideoEl);
  applyShapeToElement(localVideoEl, 'none');
  localVideoEl.classList.toggle('mirrored', groupFacingMode === 'user');

  document.getElementById('group-mute-btn').textContent = '😸';
  document.getElementById('group-mute-btn').classList.remove('active-off');
  document.getElementById('group-video-toggle-btn').textContent = withVideo ? '💅' : '💅';
  document.getElementById('group-video-toggle-btn').classList.remove('active-off');
  document.getElementById('group-camera-switch-btn').style.display = withVideo ? 'flex' : 'none';

  groupCallStartTime = Date.now();
  clearInterval(groupCallDegreeInterval);
  groupCallDegreeInterval = startDegreeCounter('group-call-duration', () => groupCallStartTime);

  if (localSpeakingDetector) localSpeakingDetector.stop();
  localSpeakingDetector = createSpeakingDetector(groupLocalStream, () => document.getElementById('group-local-video'));
}

function getOrCreateGroupPeer(username) {
  if (groupPeers.has(username)) return groupPeers.get(username);

  const pc = new RTCPeerConnection(config);
  groupRemoteDescSet.set(username, false);
  groupPendingCandidates.set(username, []);

  if (groupLocalStream) {
    groupLocalStream.getTracks().forEach(track => pc.addTrack(track, groupLocalStream));
  }

  pc.ontrack = (event) => {
    const tile = addGroupTile(username);
    const videoEl = tile.querySelector('video');
    videoEl.srcObject = event.streams[0];

    if (!groupSpeakingDetectors.has(username)) {
      const detector = createSpeakingDetector(event.streams[0], () => document.getElementById('tile-' + username));
      if (detector) groupSpeakingDetectors.set(username, detector);
    }
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('group-signal', { callId: currentCallId, to: username, data: event.candidate });
    }
  };

  pc.onconnectionstatechange = () => {
    console.log('[group-pc]', username, pc.connectionState);
    if (pc.connectionState === 'connected') {
      stopSpaceRingtone();
      document.getElementById('group-call-status').style.display = 'none';
    }
  };

  groupPeers.set(username, pc);
  return pc;
}

async function processGroupSignal(from, data) {
  const pc = getOrCreateGroupPeer(from);
  if (data.type === 'offer') {
    await pc.setRemoteDescription(new RTCSessionDescription(data));
    groupRemoteDescSet.set(from, true);
    await flushGroupPendingCandidates(from);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('group-signal', { callId: currentCallId, to: from, data: pc.localDescription });
  } else if (data.type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(data));
    groupRemoteDescSet.set(from, true);
    await flushGroupPendingCandidates(from);
  } else if (data.candidate) {
    if (groupRemoteDescSet.get(from)) {
      try { await pc.addIceCandidate(new RTCIceCandidate(data)); } catch (e) {}
    } else {
      groupPendingCandidates.get(from).push(data);
    }
  }
}

async function flushGroupPendingCandidates(username) {
  const pc = groupPeers.get(username);
  const queued = groupPendingCandidates.get(username) || [];
  for (const c of queued) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
  groupPendingCandidates.set(username, []);
}

function addGroupTile(username) {
  let tile = document.getElementById('tile-' + username);
  if (tile) return tile;
  tile = document.createElement('div');
  tile.className = 'group-tile';
  tile.id = 'tile-' + username;
  tile.innerHTML = `<video autoplay playsinline></video><div class="group-tile-name">${escapeHtml(username)}</div>`;
  applyShapeToElement(tile.querySelector('video'), 'none');
  document.getElementById('group-tiles').appendChild(tile);
  relayoutGroupTiles();
  return tile;
}

function removeGroupParticipant(username) {
  const pc = groupPeers.get(username);
  if (pc) pc.close();
  groupPeers.delete(username);
  groupRemoteDescSet.delete(username);
  groupPendingCandidates.delete(username);
  const detector = groupSpeakingDetectors.get(username);
  if (detector) detector.stop();
  groupSpeakingDetectors.delete(username);
  const tile = document.getElementById('tile-' + username);
  if (tile) tile.remove();
  relayoutGroupTiles();
}

// Detects when someone is talking (based on mic/received audio volume) and
// toggles a "speaking" class on their tile so it grows ~15% and can overlap
// neighbours slightly — a lightweight, local-only volume analysis, no
// external service involved.
function createSpeakingDetector(stream, getEl) {
  if (!stream || stream.getAudioTracks().length === 0) return null;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    let speaking = false;
    let silenceFrames = 0;
    const THRESHOLD = 0.06;

    const intervalId = setInterval(() => {
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length / 255;
      const el = getEl();
      if (!el) return;

      if (avg > THRESHOLD) {
        silenceFrames = 0;
        if (!speaking) {
          speaking = true;
          el.classList.add('speaking');
        }
      } else {
        silenceFrames++;
        if (speaking && silenceFrames > 4) {
          speaking = false;
          el.classList.remove('speaking');
        }
      }
    }, 150);

    return {
      stop: () => {
        clearInterval(intervalId);
        try { source.disconnect(); } catch (e) {}
        try { ctx.close(); } catch (e) {}
      }
    };
  } catch (e) {
    return null;
  }
}

function relayoutGroupTiles() {
  const tiles = document.querySelectorAll('.group-tile');
  const count = tiles.length;
  if (count === 0) return;

  const container = document.getElementById('group-tiles');
  const gap = 10;
  // Leave a margin so tiles don't collide with the local preview / controls
  const availableW = container.clientWidth - 20;
  const availableH = container.clientHeight - 20;

  // Try every possible column count and pick whichever gives the biggest
  // tile — this is what actually "tiles" the real screen space instead of
  // using fixed sizes that leave the screen mostly empty with few people.
  let bestSize = 0;
  for (let cols = 1; cols <= count; cols++) {
    const rows = Math.ceil(count / cols);
    const tileW = (availableW - gap * (cols - 1)) / cols;
    const tileH = (availableH - gap * (rows - 1)) / rows;
    const size = Math.min(tileW, tileH);
    if (size > bestSize) bestSize = size;
  }

  // Only a floor, no hard ceiling — the whole point is to actually use the
  // available screen space, however big it is (a huge monitor with 2 people
  // should show them big, not capped to phone-sized circles).
  bestSize = Math.max(bestSize, 60);

  tiles.forEach(t => {
    t.style.width = bestSize + 'px';
    t.style.height = bestSize + 'px';
    t.dataset.baseSize = bestSize;
  });
}

// Recompute the layout if the window/screen size changes (e.g. rotating a phone)
window.addEventListener('resize', () => {
  if (document.getElementById('group-call-screen').classList.contains('active')) {
    relayoutGroupTiles();
  }
});

async function startGroupCall(contacts, withVideo) {
  document.getElementById('group-select-modal').classList.remove('active');
  await setupGroupLocalMedia(withVideo);
  show('group-call-screen');
  startSpaceRingtone();
  document.getElementById('group-call-status').style.display = 'block';
  document.getElementById('group-call-status').textContent = '🛰️';
  socket.emit('start-group-call', { contacts, video: withVideo }, (response) => {
    currentCallId = response.callId;
  });
}

function showGroupInviteScreen(callId, from, video) {
  document.getElementById('group-invite-text').textContent =
    `👥${video ? '📹' : '📞'} ${from}`;
  document.getElementById('group-invite-modal').classList.add('active');
  startIncomingAlert();

  document.getElementById('group-accept-btn').onclick = async () => {
    stopIncomingAlert();
    document.getElementById('group-invite-modal').classList.remove('active');
    await setupGroupLocalMedia(video);
    show('group-call-screen');
    startSpaceRingtone();
    document.getElementById('group-call-status').style.display = 'block';
    document.getElementById('group-call-status').textContent = '📡';

    socket.emit('join-group-call', { callId }, async (response) => {
      if (response.error) {
        alert(response.error === 'CALL_FULL' ? '👥✖ (8)' : '📞✖');
        endGroupCall(false);
        return;
      }
      currentCallId = callId;
      // We're the newcomer — initiate a connection to each existing participant
      for (const participant of response.participants) {
        addGroupTile(participant);
        const pc = getOrCreateGroupPeer(participant);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('group-signal', { callId, to: participant, data: pc.localDescription });
      }
      document.getElementById('group-call-status').style.display = 'none';
    });
  };

  document.getElementById('group-decline-btn').onclick = () => {
    stopIncomingAlert();
    document.getElementById('group-invite-modal').classList.remove('active');
  };
}

function endGroupCall(notifyServer) {
  stopSpaceRingtone();
  stopIncomingAlert();
  const degreesRotated = totalDegreesRotated(groupCallStartTime);
  clearInterval(groupCallDegreeInterval);
  groupCallDegreeInterval = null;
  groupCallStartTime = null;
  document.getElementById('group-call-duration').style.display = 'none';

  if (notifyServer && currentCallId) {
    socket.emit('leave-group-call', { callId: currentCallId });
  }
  groupPeers.forEach(pc => pc.close());
  groupPeers.clear();
  groupRemoteDescSet.clear();
  groupPendingCandidates.clear();
  groupSpeakingDetectors.forEach(d => d.stop());
  groupSpeakingDetectors.clear();
  if (localSpeakingDetector) { localSpeakingDetector.stop(); localSpeakingDetector = null; }
  if (groupLocalStream) { groupLocalStream.getTracks().forEach(t => t.stop()); groupLocalStream = null; }
  document.getElementById('group-tiles').innerHTML = '';
  document.getElementById('group-local-video').srcObject = null;
  document.getElementById('group-local-video').classList.remove('speaking');
  currentCallId = null;
  show('contact-screen');
  loadContacts();
  loadGroupChats();

  if (degreesRotated > 0) {
    alert(`👥📞😊 🌍${degreesRotated.toFixed(3)}°`);
  }
}

document.getElementById('group-hangup').onclick = () => endGroupCall(true);

document.getElementById('group-video-toggle-btn').onclick = async () => {
  if (!groupLocalStream) return;
  const videoTracks = groupLocalStream.getVideoTracks();

  if (videoTracks.length === 0) {
    // Audio-only group call — turn the camera on for the first time
    try {
      const camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: groupFacingMode } });
      const videoTrack = camStream.getVideoTracks()[0];
      groupLocalStream.addTrack(videoTrack);
      document.getElementById('group-local-video').srcObject = groupLocalStream;
      document.getElementById('group-local-video').style.display = 'block';
      document.getElementById('group-local-video').classList.toggle('mirrored', groupFacingMode === 'user');
      document.getElementById('group-camera-switch-btn').style.display = 'flex';
      const btn = document.getElementById('group-video-toggle-btn');
      btn.textContent = '💅';
      btn.classList.remove('active-off');
      groupIsVideoOff = false;
      groupHasVideo = true;

      // Add the new track to every existing peer connection and renegotiate
      for (const [username, pc] of groupPeers.entries()) {
        pc.addTrack(videoTrack, groupLocalStream);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('group-signal', { callId: currentCallId, to: username, data: pc.localDescription });
      }
    } catch (err) {
      alert('📷✖');
    }
    return;
  }

  groupIsVideoOff = !groupIsVideoOff;
  videoTracks.forEach(t => t.enabled = !groupIsVideoOff);
  const btn = document.getElementById('group-video-toggle-btn');
  btn.textContent = groupIsVideoOff ? '😾' : '💅';
  btn.classList.toggle('active-off', groupIsVideoOff);
  document.getElementById('group-local-video').style.display = groupIsVideoOff ? 'none' : 'block';
};

document.getElementById('group-camera-switch-btn').onclick = async () => {
  if (!groupLocalStream) return;
  const videoTracks = groupLocalStream.getVideoTracks();
  if (videoTracks.length === 0) return;
  groupFacingMode = groupFacingMode === 'user' ? 'environment' : 'user';
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: groupFacingMode } });
    const newTrack = newStream.getVideoTracks()[0];
    for (const pc of groupPeers.values()) {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) await sender.replaceTrack(newTrack);
    }
    const oldTrack = videoTracks[0];
    groupLocalStream.removeTrack(oldTrack);
    oldTrack.stop();
    groupLocalStream.addTrack(newTrack);
    document.getElementById('group-local-video').srcObject = groupLocalStream;
    document.getElementById('group-local-video').classList.toggle('mirrored', groupFacingMode === 'user');
  } catch (err) {
    groupFacingMode = groupFacingMode === 'user' ? 'environment' : 'user'; // revert
    alert('🔄📷✖');
  }
};

async function renderGroupSelectList() {
  const listEl = document.getElementById('group-select-list');
  const res = await fetch('/api/contacts');
  const contacts = await res.json();
  const names = contacts.map(c => c.contact);
  // Make sure the contact whose chat we came from is always offered,
  // even if no messages have been exchanged with them yet.
  if (currentContact && !names.includes(currentContact)) {
    names.unshift(currentContact);
  }

  listEl.innerHTML = '';
  names.forEach(name => {
    const item = document.createElement('div');
    const checked = groupSelectedContacts.has(name);
    item.className = 'group-select-item' + (checked ? ' checked' : '');
    item.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}> <span>${escapeHtml(name)}</span>`;
    item.onclick = (e) => {
      const cb = item.querySelector('input');
      if (e.target !== cb) cb.checked = !cb.checked;
      if (cb.checked) {
        groupSelectedContacts.add(name);
        item.classList.add('checked');
      } else {
        groupSelectedContacts.delete(name);
        item.classList.remove('checked');
      }
    };
    listEl.appendChild(item);
  });
}

function makeDraggable(el, containerEl, onTap) {
  let dragging = false;
  let startX, startY, startLeft, startTop, moved;

  el.addEventListener('pointerdown', (e) => {
    dragging = true;
    moved = false;
    el.setPointerCapture(e.pointerId);
    const rect = el.getBoundingClientRect();
    const containerRect = containerEl.getBoundingClientRect();
    startLeft = rect.left - containerRect.left;
    startTop = rect.top - containerRect.top;
    startX = e.clientX;
    startY = e.clientY;
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.left = startLeft + 'px';
    el.style.top = startTop + 'px';
    el.style.cursor = 'grabbing';
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    const containerRect = containerEl.getBoundingClientRect();
    let newLeft = startLeft + dx;
    let newTop = startTop + dy;
    const maxLeft = containerRect.width - el.offsetWidth;
    const maxTop = containerRect.height - el.offsetHeight;
    newLeft = Math.max(0, Math.min(maxLeft, newLeft));
    newTop = Math.max(0, Math.min(maxTop, newTop));
    el.style.left = newLeft + 'px';
    el.style.top = newTop + 'px';
  });

  el.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    el.style.cursor = 'grab';
    if (!moved && onTap) onTap();
  });
}

function resetLocalVideoPosition(el) {
  el.style.left = 'auto';

}

let shapePickerContext = null; // '1to1' or 'group'

function applyShapeToElement(el, shape) {
  el.classList.remove('shape-none', 'shape-circle', 'shape-square', 'shape-star', 'shape-oval-v', 'shape-oval-h', 'shape-triangle', 'shape-hexagon', 'shape-emoji');
  el.style.webkitMaskImage = '';
  el.style.maskImage = '';

  if (shape === 'emoji') {
    // There's no official "orc" emoji in Unicode — using 🧌 (troll) as the
    // closest equivalent creature-with-a-club-ish vibe.
    el.classList.add('shape-emoji');
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='82' font-size='95' text-anchor='middle'>🧌</text></svg>`;
    const url = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    el.style.webkitMaskImage = url;
    el.style.maskImage = url;
    el.style.webkitMaskSize = 'contain';
    el.style.maskSize = 'contain';
    el.style.webkitMaskRepeat = 'no-repeat';
    el.style.maskRepeat = 'no-repeat';
    el.style.webkitMaskPosition = 'center';
    el.style.maskPosition = 'center';
  } else {
    el.classList.add('shape-' + shape);
  }
}

function openShapePicker(context) {
  shapePickerContext = context;
