<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видеозвонок</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #join-screen {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    width: 90%;
    max-width: 360px;
  }
  input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    font-size: 16px;
    width: 100%;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #2563eb; }
  #call-screen {
    display: none;
    width: 100%;
    height: 100%;
    position: relative;
  }
  #remote-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #local-video {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 140px;
    border-radius: 10px;
    border: 2px solid #fff;
    background: #000;
  }
  #status {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  #hangup {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #dc2626;
    width: auto;
    padding: 12px 24px;
  }
  #hangup:hover { background: #b91c1c; }
</style>
</head>
<body>

<div id="join-screen">
  <h2>Видеозвонок</h2>
  <p>Введите код комнаты (придумайте любой и отправьте собеседнику)</p>
  <input id="room-input" type="text" placeholder="Например: barcelona-novgorod">
  <button id="join-btn">Войти</button>
</div>

<div id="call-screen">
  <div id="status">Ожидание собеседника...</div>
  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video" autoplay playsinline muted></video>
  <button id="hangup">Завершить звонок</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const joinScreen = document.getElementById('join-screen');
const callScreen = document.getElementById('call-screen');
const roomInput = document.getElementById('room-input');
const joinBtn = document.getElementById('join-btn');
const statusEl = document.getElementById('status');
const localVideo = document.getElementById('local-video');
const remoteVideo = document.getElementById('remote-video');
const hangupBtn = document.getElementById('hangup');

let localStream;
let peerConnection;
let currentRoom;
let remoteSocketId;

// Public STUN servers help discover your public IP/port for direct P2P connection
const config = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};

joinBtn.onclick = async () => {
  const room = roomInput.value.trim();
  if (!room) return;
  currentRoom = room;

  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;

  joinScreen.style.display = 'none';
  callScreen.style.display = 'block';

  socket.emit('join-room', room);
};

socket.on('room-full', () => {
  alert('В этой комнате уже 2 человека. Попробуйте другой код комнаты.');
  location.reload();
});

socket.on('other-users', (users) => {
  if (users.length > 0) {
    remoteSocketId = users[0];
    createPeerConnection();
    makeOffer();
  }
});

socket.on('user-joined', (id) => {
  remoteSocketId = id;
  statusEl.textContent = 'Собеседник подключился...';
  createPeerConnection();
  // Wait for their offer
});

socket.on('user-left', () => {
  statusEl.textContent = 'Собеседник отключился';
  statusEl.style.display = 'block';
  remoteVideo.srcObject = null;
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
});

socket.on('signal', async ({ from, data }) => {
  if (!peerConnection) {
    remoteSocketId = from;
    createPeerConnection();
  }

  if (data.type === 'offer') {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('signal', { to: from, data: peerConnection.localDescription });
  } else if (data.type === 'answer') {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
  } else if (data.candidate) {
    try {
      await peerConnection.addIceCandidate(new RTCIceCandidate(data));
    } catch (e) {
      console.error('Error adding ICE candidate', e);
    }
  }
});

function createPeerConnection() {
  peerConnection = new RTCPeerConnection(config);

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  peerConnection.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
    statusEl.style.display = 'none';
  };

  peerConnection.onicecandidate = (event) => {
    if (event.candidate && remoteSocketId) {
      socket.emit('signal', { to: remoteSocketId, data: event.candidate });
    }
  };

  peerConnection.onconnectionstatechange = () => {
    if (peerConnection.connectionState === 'connected') {
      statusEl.style.display = 'none';
    }
  };
}

async function makeOffer() {
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit('signal', { to: remoteSocketId, data: peerConnection.localDescription });
}

hangupBtn.onclick = () => {
  location.reload();
};
</script>

</body>
</html>
